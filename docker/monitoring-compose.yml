version: '3'
services:
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml
    # k6 의 prometheus remote-write 출력을 수신하려면 receiver 활성화 필요.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

  # 부하 테스트 시에만 기동 (--profile loadtest). k6/run-waiting-queue.sh 가 수명을 관리한다.
  redis-exporter:
    image: oliver006/redis_exporter
    profiles: ["loadtest"]
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://host.docker.internal:6379
      - REDIS_EXPORTER_CHECK_SINGLE_KEYS=waiting-queue      # ZCARD → redis_key_size
      - REDIS_EXPORTER_COUNT_KEYS=entry-token:*             # SCAN 카운트 → redis_keys_count

networks:
  default:
    driver: bridge
